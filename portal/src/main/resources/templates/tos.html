<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<title>服務條款設定</title>
<link rel="stylesheet" href="/css/portal.css"/>
<script src="/js/jquery.min.js"></script>
</head>
<body>
<div class="topbar">new-pay Portal | <span th:text="${user}">?</span>
  <a href="/">首頁</a><a href="/report?type=trans">交易報表</a><a href="/report?type=refund">退款報表</a><a href="/recon">對帳查詢</a><a href="/tos">服務條款</a><a href="/bankacc">銀行帳戶</a><a href="/csr">CSR查詢</a><a href="/logout">登出</a>
</div>
<div class="wrap">
  <h3>服務條款設定 (SA Portal)</h3>
  <div class="box">
    商家代碼 <input type="text" id="merchantID" size="10" value="E000001"/>
    <button id="btnQuery">查詢/新增服務條款</button>
    <span class="note">版次由系統控管；建立後該版次不可修改，要改請建立新版次</span>
  </div>
  <div class="box" id="form" style="display:none;">
    <p>服務條款版次: <b id="verShow">1</b></p>
    <p>目前內容:</p>
    <pre id="curContent" style="background:#f7f7f7;border:1px solid #ddd;padding:8px;"></pre>
    <div id="editArea">
      <p>生效日期 <input type="text" id="startDate" size="14" placeholder="yyyyMMddHHmmss"/></p>
      <p>服務條款內容<br/><textarea id="content" rows="5" cols="70"></textarea></p>
      <p>註記 <input type="text" id="note" size="40"/></p>
      <p><button id="btnSave">存檔</button></p>
    </div>
    <p><button id="btnNewVer" style="display:none;">建立新版次</button></p>
    <p id="msg" class="note"></p>
  </div>
</div>
<script>
var latestVer = 0;
$(function(){
  $('#btnQuery').click(function(){
    $.get('/tos/data', { merchantID: $('#merchantID').val() }, function(data){
      var list = data;
      if (typeof list == 'string') list = JSON.parse(data);
      $('#form').show(); $('#msg').text('');
      if (list.length == 0) {
        // scenario 1: 第一次建立 -> 空白表單, 只顯示存檔
        latestVer = 0;
        $('#verShow').text('1');
        $('#curContent').text('(尚無服務條款)');
        $('#editArea').show(); $('#btnNewVer').hide();
      } else {
        // scenario 2: 顯示最新版次, 只顯示建立新版次
        latestVer = list[0].TOS_VERSION;
        $('#verShow').text(latestVer);
        $('#curContent').text(list[0].TOS_CONTENT + '\n(URL: ' + list[0].TOS_URL + ')');
        $('#editArea').hide(); $('#btnNewVer').show();
      }
    });
  });
  $('#btnNewVer').click(function(){
    // scenario 3: 建立新版次 -> 顯示空白表單, 版次+1, 只顯示存檔
    $('#verShow').text(latestVer + 1);
    $('#content').val(''); $('#note').val('');
    $('#editArea').show(); $('#btnNewVer').hide();
  });
  $('#btnSave').click(function(){
    $.post('/tos/save', {
      merchantID: $('#merchantID').val(), startDate: $('#startDate').val(),
      content: $('#content').val(), note: $('#note').val()
    }, function(r){
      $('#msg').text(r);
      $('#btnQuery').click(); // 存檔完重查
    });
  });
});
</script>
</body>
</html>
