<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<title>CSR 交易查詢</title>
<link rel="stylesheet" href="/css/portal.css"/>
<script src="/js/jquery.min.js"></script>
</head>
<body>
<div class="topbar">new-pay Portal | <span th:text="${user}">?</span>
  <a href="/">首頁</a><a href="/report?type=trans">交易報表</a><a href="/report?type=refund">退款報表</a><a href="/recon">對帳查詢</a><a href="/tos">服務條款</a><a href="/bankacc">銀行帳戶</a><a href="/csr">CSR查詢</a><a href="/logout">登出</a>
</div>
<div class="wrap">
  <h3>查詢 new-pay 交易紀錄 (CSR Portal)</h3>
  <div class="box">
    門號 <input type="text" id="msisdn" size="12" value="0912345678"/>
    <button id="btnQuery">查詢</button>
    <span class="note">含退款紀錄與授權時間; OLS 交易可看到商品名稱(PaymentDescription)與商家資訊(MerchantContact)</span>
  </div>
  <div id="result" class="box">請輸入門號查詢</div>
</div>
<script>
$(function(){
  $('#btnQuery').click(function(){
    $('#result').html('查詢中...');
    $.get('/csr/data', { msisdn: $('#msisdn').val() }, function(data){
      $('#result').html(data);
    });
  });
});
</script>
</body>
</html>
