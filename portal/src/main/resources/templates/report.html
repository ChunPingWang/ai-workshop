<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<title>交易報表查詢</title>
<link rel="stylesheet" href="/css/portal.css"/>
<script src="/js/jquery.min.js"></script>
</head>
<body>
<div class="topbar">new-pay Portal | <span th:text="${user}">?</span>
  <a href="/">首頁</a><a href="/report?type=trans">交易報表</a><a href="/report?type=refund">退款報表</a><a href="/recon">對帳查詢</a><a href="/tos">服務條款</a><a href="/bankacc">銀行帳戶</a><a href="/csr">CSR查詢</a><a href="/logout">登出</a>
</div>
<div class="wrap">
  <h3 id="title">交易報表查詢</h3>
  <div class="box">
    <input type="hidden" id="type" th:value="${type}"/>
    日期(起) <input type="text" id="fromDate" size="8" placeholder="yyyyMMdd"/>
    時 <select id="fromHour"></select>
    日期(迄) <input type="text" id="toDate" size="8" placeholder="yyyyMMdd"/>
    時 <select id="toHour"></select>
    <span id="transOnly">
      商家 <input type="text" id="merchantId" size="8" value="E000001"/>
      時間類型 <select id="timeType">
        <option value="tx">交易時間</option>
        <option value="auth">授權時間(只限OLS)</option>
      </select>
    </span>
    <button id="btnQuery">查詢</button>
    <span class="note">畫面僅顯示10筆資料，其餘透過背景處理匯出CSV(匯出功能尚未提供)</span>
  </div>
  <div id="result" class="box">請輸入條件查詢</div>
</div>
<script>
$(function(){
  // 小時下拉 00~23
  for (var i = 0; i < 24; i++) {
    var h = (i < 10 ? '0' : '') + i;
    $('#fromHour').append('<option>' + h + '<\/option>');
    $('#toHour').append('<option>' + h + '<\/option>');
  }
  $('#toHour').val('23');
  // 預設帶今天
  var d = new Date();
  var today = '' + d.getFullYear() + ((d.getMonth()<9?'0':'')+(d.getMonth()+1)) + ((d.getDate()<10?'0':'')+d.getDate());
  $('#fromDate').val(today); $('#toDate').val(today);

  if ($('#type').val() == 'refund') {
    $('#title').text('退款交易報表查詢');
    $('#transOnly').hide();
  }

  $('#btnQuery').click(function(){
    var from = $('#fromDate').val() + $('#fromHour').val();
    var to = $('#toDate').val() + $('#toHour').val();
    $('#result').html('查詢中...');
    $.get('/report/data', {
      type: $('#type').val(), from: from, to: to,
      merchantId: $('#merchantId').val(), timeType: $('#timeType').val()
    }, function(data){
      $('#result').html(data); // backend 回來的 HTML 直接塞
    });
  });
});
</script>
</body>
</html>
